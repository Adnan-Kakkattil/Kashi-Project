services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: site-safety-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./scripts/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  node-red:
    image: nodered/node-red:latest
    container_name: site-safety-nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=Asia/Singapore
    volumes:
      - node_red_data:/data
      - ./node-red/flows.json:/data/flows.json
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  node_red_data:
